name: Pull request title

# Pull requests are squash merged with their title as commit message, which release-please
# uses to derive the next version and the changelog entry
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
