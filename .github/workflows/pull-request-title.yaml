name: Pull request title

# Pull requests are squash merged with their title as commit message, which release-please
# uses to derive the next version and the changelog entry
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Check pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
