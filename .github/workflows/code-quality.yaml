name: Code quality

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Full history for checking the commit messages of the pull request
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create Virtual environment
        run: uv sync
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      # release-please derives versions and the changelog from the commit messages, the
      # commitizen-branch hook only runs at the pre-push stage which run --all-files skips
      - name: Check commit messages
        run: >-
          uv run pre-commit run commitizen-branch --hook-stage pre-push
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref ${{ github.event.pull_request.head.sha }}

  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory:
          - "."
          - examples/basic
          - examples/advanced
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: Initialize
        working-directory: ${{ matrix.directory }}
        run: tofu init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: tofu validate
